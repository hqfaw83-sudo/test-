name: Build iPhone test IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile unsigned device app
        run: >-
          xcodebuild -project AirPodsHealthProbe.xcodeproj
          -scheme AirPodsHealthProbe -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AirPodsHealthProbe.app Payload/
          /usr/bin/ditto -c -k --keepParent Payload AirPodsHealthProbe-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AirPodsHealthProbe-unsigned
          path: AirPodsHealthProbe-unsigned.ipa
