name: Build iPhone test IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify listening calculations
        run: python3 check_math.py
      - name: Compile unsigned device app
        run: >-
          xcodebuild -project AirPodsHealthProbe.xcodeproj
          -scheme AirPodsHealthProbe -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AirPodsHealthProbe.app Payload/
          /usr/bin/ditto -c -k --keepParent Payload AirPodsHealthProbe-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AirPodsHealthProbe-unsigned
          path: AirPodsHealthProbe-unsigned.ipa
      - name: Render glass interface previews
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project AirPodsHealthProbe.xcodeproj -scheme AirPodsHealthProbe -configuration Release -destination "id=$DEVICE" -derivedDataPath simulator CODE_SIGNING_ALLOWED=NO build
          xcrun simctl install "$DEVICE" simulator/Build/Products/Release-iphonesimulator/AirPodsHealthProbe.app
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl launch "$DEVICE" com.airpodsprobe.healthtest --ui-preview
          sleep 4
          xcrun simctl io "$DEVICE" screenshot preview-light.png
          xcrun simctl ui "$DEVICE" appearance dark
          sleep 2
          xcrun simctl io "$DEVICE" screenshot preview-dark.png
          xcrun simctl terminate "$DEVICE" com.airpodsprobe.healthtest
          xcrun simctl launch "$DEVICE" com.airpodsprobe.healthtest --ui-preview --preview-stats
          sleep 2
          xcrun simctl io "$DEVICE" screenshot preview-stats.png
          xcrun simctl terminate "$DEVICE" com.airpodsprobe.healthtest
          xcrun simctl launch "$DEVICE" com.airpodsprobe.healthtest --ui-preview --preview-devices
          sleep 2
          xcrun simctl io "$DEVICE" screenshot preview-devices.png
      - uses: actions/upload-artifact@v4
        with:
          name: Interface-previews
          path: preview-*.png
